[alembic]
script_location = app/infrastructure/postgres/migrations
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally left blank. env.py reads the connection
# string from application Settings (RISKLENS_DATABASE_URL / .env) so the
# migrations and the running service can never drift onto different databases.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
